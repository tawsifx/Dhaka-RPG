name: 24/7 Telegram Cloud Runner

on:
  repository_dispatch:
    types: [telegram_instruction]
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Instruction Prompt'
        required: true
        default: 'Check game code'
      chat_id:
        description: 'Telegram Chat ID (optional)'
        required: false

jobs:
  run-instruction:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: |
          npm ci || npm install

      - name: Notify Telegram (Job Started)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id || inputs.chat_id || secrets.ALLOWED_CHAT_ID }}
          PROMPT: ${{ github.event.client_payload.prompt || inputs.prompt }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$CHAT_ID" ]; then
            TEXT="⚙️ *[GitHub Actions 24/7 Runner]* Running in cloud on Ubuntu runner!%0A📝 *Instruction:* ${PROMPT}"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=${TEXT}" \
              -d "parse_mode=Markdown" || true
          fi

      - name: Execute Cloud Instruction
        env:
          PROMPT: ${{ github.event.client_payload.prompt || inputs.prompt }}
          CHAT_ID: ${{ github.event.client_payload.chat_id || inputs.chat_id || secrets.ALLOWED_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ANTIGRAVITY_API_KEY: ${{ secrets.ANTIGRAVITY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: |
          echo "Running cloud task for: $PROMPT"
          node scripts/cloud-runner.js "$PROMPT"

      - name: Verify Code Syntax
        run: |
          node -c game.js
          echo "✅ Syntax check passed!"

      - name: Stage, Commit, and Push Changes
        id: git_commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Auto-update via 24/7 Telegram Runner: ${{ github.event.client_payload.prompt || inputs.prompt }}"
            git push origin main
            echo "committed=true" >> $GITHUB_OUTPUT
          else
            echo "committed=false" >> $GITHUB_OUTPUT
            echo "No file modifications to commit."
          fi

      - name: Notify Telegram (Success)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id || inputs.chat_id || secrets.ALLOWED_CHAT_ID }}
          COMMITTED: ${{ steps.git_commit.outputs.committed }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$CHAT_ID" ]; then
            if [ "$COMMITTED" = "true" ]; then
              TEXT="✅ *[GitHub Actions] Success!*%0AChanges committed and pushed to GitHub main.%0ARunning production deployment on Vercel...%0A🔗 https://moonwalkersday.vercel.app"
            else
              TEXT="ℹ️ *[GitHub Actions] Task Completed!*%0AWorkflow ran successfully. No code changes needed."
            fi
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=${TEXT}" \
              -d "parse_mode=Markdown" || true
          fi

      - name: Notify Telegram (Failure)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id || inputs.chat_id || secrets.ALLOWED_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$CHAT_ID" ]; then
            TEXT="❌ *[GitHub Actions] Run Encountered An Error!*%0ACheck workflow logs: https://github.com/tawsifx/Dhaka-RPG/actions"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=${TEXT}" \
              -d "parse_mode=Markdown" || true
          fi

