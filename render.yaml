services:
  - type: web
    name: dhaka-rpg-bot
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node telegram-bot.js
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_CHAT_ID
        sync: false
      - key: GH_PAT
        sync: false
